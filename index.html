eeft 2 munten. Versla je hem, dan krijg je nog eens 80."},"how":{"ru":"Лиса шагает по списку клеточек. Ловушка проверяет расстояние до лисы, ждёт перезарядки и бросает случайное число: так получается шанс попадания. Сетка замедляет, а остальные ловушки снимают сердечки. За остановленных лис дают монеты.","en":"Each animal follows a list of squares. Traps check the distance, wait for their cooldown and roll a random number to decide a hit. Nets slow foxes, while other traps deal damage. Stop animals to earn coins.","nl":"Elk dier volgt een lijst met vakjes. Een val controleert de afstand, wacht tot hij weer klaar is en kiest een willekeurig getal om te bepalen of hij raakt. Netten vertragen vossen; andere vallen doen schade. Voor elk gestopt dier krijg je munten."},"countries":{"ru":"Пять стран: Лес, Горы, Джунгли, Снега и Замок. По десять уровней в каждой. В каждой новой стране — свой лабиринт с большим числом поворотов. При переходе в другую страну все ловушки, даже сломанные, убираются и возвращается полная цена покупки. Между уровнями одной страны ловушки остаются. Все числа — первая проба для совместной настройки!","en":"Five lands: Forest, Mountains, Jungle, Snow and Castle. Each has ten levels and its own maze with more turns. Entering a new land removes all traps, even broken ones, and refunds their full purchase price. Traps stay between levels in the same land. These numbers are a first try for us to tune together!","nl":"Vijf landen: Bos, Bergen, Jungle, Sneeuw en Kasteel. Elk land heeft tien levels en een eigen doolhof met meer bochten. In een nieuw land verdwijnen alle vallen, ook kapotte, en krijg je de volledige aankoopprijs terug. Binnen hetzelfde land blijven de vallen staan. We kunnen de spelregels samen verder aanpassen!"},"wolfHelp":{"ru":"🐺 С третьего уровня приходят волки. Они крепче лис и разрывают сетку когтями — замедлить их сеткой нельзя! За волка дают 14 монет.","en":"🐺 Wolves arrive from level 3. They are tougher than foxes and shred nets translations.upgradeHelp={"ru": "Нажми на установленную ловушку, чтобы выбрать её. Можно купить два улучшения: каждое добавляет 50% исходной прочности и урона. Сетка вместо урона дольше замедляет. При смене страны возвращается вся цена с улучшениями. Между волнами можно убрать выбранную ловушку за 70% её цены.", "en": "Click a placed trap to select it. Buy up to two upgrades: each adds 50% of the original durability and damage. Nets slow for longer instead. A new land refunds the full price including upgrades. Between waves you can remove a selected trap for 70% of its price.", "nl": "Klik op een geplaatste val om hem te kiezen. Koop maximaal twee verbeteringen: elk geeft 50% extra oorspronkelijke stevigheid en schade. Netten vertragen langer. Bij een nieuw land krijg je de volledige prijs met verbeteringen terug. Tussen golven kun je een gekozen val weghalen voor 70% van zijn prijs."};
translations.bearHelp={"ru": "🐻 С уровня 5: медведь крепче волка, но медленнее. Сетка замедляет его сильнее. Он отбивает 60% попавших стрел лука и 25% стрел дерева.", "en": "🐻 From level 5: bears are tougher than wolves but slower. Nets slow them more. They deflect 60% of bow hits and 25% of arrow-tree hits.", "nl": "🐻 Vanaf level 5: beren zijn sterker dan wolven, maar langzamer. Netten vertragen ze meer. Ze weren 60% van de rake boogpijlen en 25% van de pijlenboompijlen af."};
translations.hareHelp={"ru": "🐇 С уровня 2: заяц слабее лисы, но быстрее. Может перепрыгнуть камни: шанс 70%, против улучшенных — 45% и 25%.", "en": "🐇 From level 2: hares are weaker than foxes but faster. They can jump over rock traps: 70% chance, or 45% and 25% against upgraded ones.", "nl": "🐇 Vanaf level 2: hazen zijn zwakker dan vossen, maar sneller. Ze springen over stenenvallen: 70% kans, of 45% en 25% bij verbeterde vallen."};
translations.retryHelp={"ru": "Если зверь доберётся до пирога, он съест кусочек (босс — три), и уровень попробует другой игрок. Пирог не восстанавливается. Монеты и ловушки возвращаются к состоянию перед волной. Если прорвался босс, в следующей попытке у него на 10% меньше здоровья (не ниже 65% начального). Когда пирог закончится, игра окончена.", "en": "If an animal reaches the pie, it eats a slice (a boss eats three) and the other player retries the level. Pie is not restored. Coins and traps return to their state before the wave. If a boss escaped, it has 10% less health next attempt (at least 65% of its original health). When the pie runs out, the game is over.", "nl": "Als een dier de taart bereikt, eet het een stuk (een eindbaas drie) en probeert de andere speler het level opnieuw. De taart wordt niet hersteld. Munten en vallen gaan terug naar de toestand van vóór de golf. Na ontsnappen heeft de eindbaas bij de volgende poging 10% minder gezondheid (minimaal 65% van het begin). Is de taart op, dan is het spel afgelopen."};

// All sound is synthesized here, so the HTML also works offline.
// Browsers unlock audio on the first pointer or keyboard interaction.
let soundEnabled=true,audioContext=null,audioMaster=null,audioCompressor=null,audioNoise=null,soundAvailable=true;
const soundTimes=new Map(),audioVoices=new Set();
function soundButton(){let b=$('#sound');b.textContent=tr(!soundAvailable?'soundUnavailable':soundEnabled?'soundOn':'soundOff');b.setAttribute('aria-pressed',String(soundEnabled));b.disabled=!soundAvailable;}
function audioVolume(value){if(!audioMaster)return;let t=audioContext.currentTime;audioMaster.gain.cancelScheduledValues(t);audioMaster.gain.setValueAtTime(value,t);}
function stopSounds(){for(let voice of audioVoices){try{voice.stop()}catch{}}audioVoices.clear();soundTimes.clear();}
function initAudio(){
if(audioContext)return;
let Audio=globalThis.AudioContext||globalThis.webkitAudioContext;if(!Audio)throw Error('Audio unavailable');
audioContext=new Audio();audioMaster=audioContext.createGain();audioMaster.gain.value=0;
audioCompressor=audioContext.createDynamicsCompressor();audioMaster.connect(audioCompressor);audioCompressor.connect(audioContext.destination);
audioNoise=audioContext.createBuffer(1,Math.ceil(audioContext.sampleRate*.4),audioContext.sampleRate);let data=audioNoise.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
}
function tone(hz,end,offset,length,type='sine',volume=.15){
if(audioVoices.size>=32)return;
let at=audioContext.currentTime+offset,osc=audioContext.createOscillator(),env=audioContext.createGain();osc.type=type;osc.frequency.setValueAtTime(hz,at);osc.frequency.exponentialRampToValueAtTime(Math.max(30,end),at+length);env.gain.setValueAtTime(.0001,at);env.gain.exponentialRampToValueAtTime(volume,at+.008);env.gain.exponentialRampToValueAtTime(.0001,at+length);osc.connect(env);env.connect(audioMaster);audioVoices.add(osc);osc.onended=()=>{audioVoices.delete(osc);osc.disconnect();env.disconnect()};osc.start(at);osc.stop(at+length+.015);
}
function rustle(offset,length,frequency=1600){
if(audioVoices.size>=32)return;
let at=audioContext.currentTime+offset,source=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),env=audioContext.createGain();source.buffer=audioNoise;filter.type='bandpass';filter.frequency.value=frequency;filter.Q.value=.7;env.gain.setValueAtTime(.0001,at);env.gain.exponentialRampToValueAtTime(.16,at+.008);env.gain.exponentialRampToValueAtTime(.0001,at+length);source.connect(filter);filter.connect(env);env.connect(audioMaster);audioVoices.add(source);source.onended=()=>{audioVoices.delete(source);source.disconnect();filter.disconnect();env.disconnect()};source.start(at);source.stop(at+length+.015);
}
function sound(kind){
if(!kind||!soundEnabled||!audioContext||audioContext.state!=='running')return;
let now=audioContext.currentTime;if(now-(soundTimes.get(kind)??-99)<.09)return;soundTimes.set(kind,now);
try{
switch(kind){
case 'on':case 'build':tone(523,659,0,.12);tone(784,1047,.1,.18);break;
case 'repair':tone(392,523,0,.09,'triangle');tone(659,784,.09,.12);tone(1047,1319,.19,.18);break;
case 'bow':tone(740,210,0,.13,'triangle',.10);break;
case 'tree':tone(880,260,0,.1,'triangle',.08);tone(1047,330,.045,.1,'triangle',.07);break;
case 'net':tone(220,480,0,.18,'sine',.12);break;
case 'rockDrop':tone(620,120,0,.4,'sine',.09);break;
case 'rockHit':tone(110,45,0,.2,'triangle',.22);tone(260,440,.07,.13,'sine',.1);rustle(0,.16,420);break;
case 'hit':tone(410,210,0,.075,'sine',.09);break;
case 'catch':tone(330,165,0,.18,'triangle',.12);break;
case 'tear':rustle(0,.16,1800);rustle(.23,.19,2300);tone(180,330,.04,.09,'triangle',.10);tone(220,460,.27,.1,'triangle',.10);break;
case 'block':tone(920,1400,0,.09,'triangle',.12);rustle(0,.07,2200);break;
case 'jump':tone(280,690,0,.15,'sine',.1);break;
case 'coin':tone(1047,1319,0,.07,'sine',.09);tone(1568,1760,.065,.12,'sine',.07);break;
case 'magic':for(let i=0;i<5;i++)tone(440+i*140,880+i*140,i*.06,.18,'sine',.09);break;
case 'broken':tone(220,180,0,.09,'triangle',.12);tone(160,80,.1,.14,'triangle',.1);break;
case 'start':tone(392,392,0,.09,'triangle');tone(523,523,.1,.1,'triangle');tone(784,784,.21,.19);break;
case 'win':for(let [i,hz] of [523,659,784,1047,784,1047].entries())tone(hz,hz,i*.11,.2,'triangle',.12);break;
case 'loss':for(let [i,hz] of [392,330,262,196].entries())tone(hz,hz*.95,i*.16,.23,'sine',.12);break;
case 'error':tone(190,150,0,.12,'sine',.09);break;
}
}catch{soundEnabled=false;audioVolume(0);stopSounds();soundButton();}
}
async function unlockAudio(feedback=false){
if(!soundEnabled||!soundAvailable)return;
try{initAudio();audioVolume(.25);if(audioContext.state!=='running')await audioContext.resume();if(soundEnabled&&feedback)sound('on');}
catch{soundEnabled=false;soundAvailable=false;audioVolume(0);stopSounds();soundButton();}
}
$('#sound').onclick=async()=>{
if(soundEnabled){soundEnabled=false;audioVolume(0);stopSounds();soundButton();return;}
soundEnabled=true;soundButton();await unlockAudio(true);
};
function firstAudioGesture(e){if(e.target===$('#sound'))return;if(soundEnabled&&(!audioContext||audioContext.state!=='running'))void unlockAudio();}
document.addEventListener('pointerdown',firstAudioGesture,{capture:true});
document.addEventListener('keydown',firstAudioGesture,{capture:true});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea,[contenteditable="true"],a[href]'))e.preventDefault();});

let setupCount=1;
function normalizePlayerNames(names){
if(!Array.isArray(names)||names.length<1||names.length>4||names.some(n=>typeof n!=='string'))return null;
const clean=names.map((n,i)=>n.trim().replace(/\s+/g,' ')||tr('playerSlot',{n:i+1}));
if(clean.some(n=>n.length>24||/[\u0000-\u001f\u007f-\u009f\u202a-\u202e\u2066-\u2069]/.test(n)))return null;
return clean;
}
function updatePlayerSetupLabels(){

for(let i=0;i<4;i++){const name=tr('playerSlot',{n:i+1});$('#playerLabel'+i).textContent=(i===0?tr('yourName'):name);$('#playerName'+i).placeholder=tr('enterName');$('#removePlayer'+i).textContent=tr('removePlayer');$('#removePlayer'+i).setAttribute('aria-label',tr('removePlayer')+' · '+name);}
if($('#playersError').textContent)$('#playersError').textContent=tr('playersInvalid');
}
function updatePlayerFields(){for(let i=0;i<4;i++){$('#playerRow'+i).hidden=i>=setupCount;$('#playerName'+i).disabled=i>=setupCount;$('#playerName'+i).setAttribute('enterkeyhint',i<setupCount-1?'next':'done');$('#removePlayer'+i).hidden=i===0;}$('#addPlayer').hidden=setupCount===4;$('#allPlayers').hidden=setupCount!==4;$('#playersError').textContent='';}
function openPlayerSetup(){nameViewport=null;activeNameIndex=0;setupCount=1;for(let i=0;i<4;i++)$('#playerName'+i).value='';updatePlayerSetupLabels();updatePlayerFields();if(!$('#playersDialog').open)$('#playersDialog').showModal();$('#playersTitle').focus?.();updateDeviceLayout();}
function createPlayers(names){const clean=normalizePlayerNames(names);if(!clean)return false;try{sessionStorage.removeItem(UPDATE_STATE_KEY)}catch{}players=clean;needsPlayerSetup=false;$('#playersDialog').close();nameViewport=null;updateDeviceLayout();$('#settings').open=false;reset();if(players.length===1){turnReady=true;say('yourTurn',{name:currentPlayer()});ui();}return true;}

const SAVE_GAME_KEY='foxPieSavedGameV1';
function isPaused(){return running&&(manualPaused||visibilityPaused||!!$('#settings').open||!!$('#restartDialog').open||!!$('#playersDialog').open||!!$('#installDialog').open);}
function gameSnapshot(){return {version:2,players:[...players],level,playerIndex,bossRetryCount,money,pie,traps:traps.map(t=>({...t})),selected,speed,turnReady,retryPending,over,lastResult,seenKinds:[...seenKinds]};}
function saveGame(replayWave=false){if(!saveEnabled||!saveAvailable||running||needsPlayerSetup)return false;try{const json=JSON.stringify({...gameSnapshot(),replayWave:replayWave||(resumePending&&resumeWave)});if(json!==lastSavedGame){localStorage.setItem(SAVE_GAME_KEY,json);lastSavedGame=json;}return true;}catch{saveAvailable=false;return false;}}
function readSavedGame(){try{const raw=localStorage.getItem(SAVE_GAME_KEY);return raw?JSON.parse(raw):null;}catch{return null;}}
function cleanSavedResult(result){
if(!result||!['passed','retry'].includes(result.kind)||!Number.isInteger(result.level)||result.level<1||result.level>50)return null;
const clean={kind:result.kind,level:result.level};
if(result.kind==='retry'){
if(!Number.isInteger(result.loss)||result.loss<0||result.loss>10||!Number.isInteger(result.pie)||result.pie<0||result.pie>10)return null;
clean.loss=result.loss;clean.pie=result.pie;
}
if(result.refund!==undefined){if(!Number.isFinite(result.refund)||result.refund<0||result.refund>1e9)return null;clean.refund=result.refund;}
return clean;
}
function restoreGameState(state){
try{
if(!state||![1,2].includes(state.version)||!Number.isInteger(state.level)||state.level<1||state.level>50||!Number.isInteger(state.playerIndex)||!Number.isFinite(state.money)||state.money<0||state.money>1e9||!Number.isInteger(state.pie)||state.pie<0||state.pie>10||!Array.isArray(state.traps))return false;
// Normalize saved data before applying it; never retain arbitrary object fields.
const savedPlayers=state.version===1?[tr('nameY'),tr('nameM')]:normalizePlayerNames(state.players);
if(!savedPlayers||state.playerIndex<0||state.playerIndex>=savedPlayers.length)return false;
const cells=new Set(),savedTraps=[];
for(const t of state.traps){
if(!t||!Number.isInteger(t.x)||t.x<0||t.x>=W||!Number.isInteger(t.y)||t.y<0||t.y>=H||!Number.isInteger(t.type)||t.type<0||t.type>=types.length||!Number.isInteger(t.uses)||t.uses<0||![0,1,2].includes(t.tier??0))continue;
const key=t.x+','+t.y;if(cells.has(key))continue;cells.add(key);
const clean={x:t.x,y:t.y,type:t.type,tier:t.tier??0,uses:t.uses,broken:t.broken===true,cd:0};
clean.uses=Math.min(clean.uses,durability(clean));
clean.invested=Number.isFinite(t.invested)&&t.invested>=types[t.type].cost&&t.invested<=1e9?t.invested:types[t.type].cost;
savedTraps.push(clean);
}
const result=cleanSavedResult(state.lastResult),kinds=Array.isArray(state.seenKinds)?[...new Set(state.seenKinds.filter(k=>['fox','wolf','bear','hare','boss'].includes(k)))]:[];
players=savedPlayers;needsPlayerSetup=false;level=state.level;playerIndex=state.playerIndex;money=state.money;pie=state.pie;bossRetryCount=Number.isSafeInteger(state.bossRetryCount)&&state.bossRetryCount>=0?state.bossRetryCount:0;loadMaze();traps=savedTraps;
selected=Number.isInteger(state.selected)&&state.selected>=0&&state.selected<types.length?state.selected:0;speed=speeds.includes(state.speed)?state.speed:1;over=pie===0||state.over===true;turnReady=!over&&state.turnReady===true;retryPending=!over&&state.retryPending===true;running=false;summoned=0;foxes=[];effects=[];waveSnapshot=null;selectedTrap=null;pendingPlacement=null;manualPaused=false;visibilityPaused=false;
lastResult=result;seenKinds=kinds;showPlacementHints=traps.length===0;return true;
}catch{return false;}
}
function waveRoster(){const counts=new Map(),count=5+Math.floor(level*.8);for(let i=0;i<count;i++){const kind=enemyKind(level,i,level%10===0&&i===count-1);counts.set(kind,(counts.get(kind)||0)+1);}return [...counts].map(([kind,count])=>({kind,count}));}

function uxUi(){
if(running&&(manualPaused||visibilityPaused)&&!$('#restartDialog').open)$('#settings').open=true;const paused=isPaused();$('#pauseOverlay').hidden=true;$('#workshop').dataset.menuOpen=String(!!$('#settings').open);$('.field').dataset.paused=String(paused);$('#menuToggle').setAttribute('aria-expanded',String(!!$('#settings').open));setUiText('#menuToggle',$('#settings').open?'×':'☰');const menuLabel=tr($('#settings').open?'backToGame':running?'pauseMenu':'settingsTitle');$('#menuToggle').setAttribute('aria-label',menuLabel);$('#menuToggle').title=menuLabel;setUiText('#menuHeading',running?'Ⅱ '+tr('paused'):tr('settingsHeading'));setUiText('#resumeBattle',tr(running?'resumeMenu':'backToGame'));$('#start').hidden=running;
$('#start').disabled=over||!turnReady;setUiText('#start',running?(phoneMode?(paused?'▶':'Ⅱ'):tr(paused?'resume':'pause')):tr(phoneMode?(level%10===0?'shortBoss':'shortStart'):(level%10===0?'summon':'start')));$('#start').setAttribute('aria-label',tr(running?(paused?'resume':'pause'):(level%10===0?'summon':'start')));
setUiText('#currentPlayerBadge',(['🟠 ','🔵 ','🟢 ','🟣 '][playerIndex])+currentPlayer());$('#currentPlayerBadge').dataset.player=String(playerIndex);
const icons={fox:'🦊',wolf:'🐺',bear:'🐻',hare:'🐇',boss:'👑'},roster=waveRoster(),animals=roster.map(e=>icons[e.kind]+' '+e.count).join('  ');
setUiText('#waveProgress',running?(paused?'⏸ '+tr('paused'):tr('waveProgress',{n:spawned+summoned,total:total+summoned,alive:foxes.filter(f=>f.hp>0).length})):over?'':animals);$('#waveProgress').setAttribute('aria-label',running?$('#waveProgress').textContent:tr('wavePreview',{animals}));
let hint='';if(turnReady&&!over&&!selectedTrap){if(showPlacementHints){hint=money<types[selected].cost?tr('shortfall',{n:types[selected].cost-money}):tr(selected===3?'placeRoadShort':'placeGrassShort');}if(!running){const fresh=[...roster].reverse().find(e=>!seenKinds.includes(e.kind));if(fresh&&!(fresh.kind==='fox'&&showPlacementHints))hint+=(hint?'\n':'')+tr(fresh.kind+'Intro');}}if(level===50&&!running&&!over)hint+=(hint?'\n':'')+tr('finalBossWarning');setUiText('#prepHint',hint);
let result='';if(resumePending){result=tr(resumeWave?'resumeWave':'resumePrep',{n:level,name:currentPlayer(),pie});$('#ready').textContent=tr('continueGame');}else if(lastResult){result=tr(lastResult.kind==='retry'?'resultRetry':'resultPassed',{n:lastResult.level,loss:lastResult.loss,pie:lastResult.pie});if(lastResult.kind==='retry')result+='\n'+tr('resultRollback');if(lastResult.refund!==undefined)result+='\n'+tr('resultRefund',{n:lastResult.refund});}if(!turnReady&&speed>1)result+=(result?'\n':'')+tr('speedNotice',{n:speed});setUiText('#turnResult',result);
 document.querySelectorAll('.card').forEach((b,i)=>{const missing=Math.max(0,types[i].cost-money);b.dataset.affordable=String(!missing);b.title=tr('desc'+i)+(missing?' · '+tr('shortfall',{n:missing}):'');b.setAttribute('aria-label',tr('trap'+i)+' · '+types[i].cost+' 🪙 · '+tr('desc'+i)+(missing?' · '+tr('shortfall',{n:missing}):''));const label=b.querySelector?.('.card-shortfall');if(label){const text=missing?tr('shortNeed',{n:missing}):'';if(label.textContent!==text)label.textContent=text;}});

function simulate(dt){let remaining=dt;while(remaining>0){let step=Math.min(remaining,.025);update(step);remaining-=step;}}
function frame(now){let view=viewportSize();if(view.width!==lastViewportWidth||view.height!==lastViewportHeight)updateDeviceLayout();fitBoard();let dt=Math.min((now-last)/1000,.05);last=now;if(!isPaused())simulate(dt*speed);applyPendingUpdate();draw();requestAnimationFrame(frame)}reset();if(!restoreUpdateState()){const saved=readSavedGame();if(saved&&restoreGameState(saved)){resumePending=!over;resumeWave=!!saved.replayWave;turnReady=false;}}saveEnabled=true;updateLanguage();updateDeviceLayout();if(needsPlayerSetup)openPlayerSetup();requestAnimationFrame(frame);
